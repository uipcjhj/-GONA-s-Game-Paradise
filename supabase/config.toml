# Supabase CLI 설정 (supabase functions deploy 가 읽음)
# 함수들은 브라우저 CORS 사전 요청(OPTIONS, 토큰 없음)을 받아야 하므로 게이트웨이 JWT 검사를 끄고,
# 대신 함수 안의 requireUser() 가 로그인 토큰을 Supabase Auth 로 직접 확인함 (_shared/auth.ts)
[functions.start-play]
verify_jwt = false

[functions.submit-score]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
