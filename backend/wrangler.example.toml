# 예시일 뿐입니다 — 계정/DB 를 만들지 않았고 값은 모두 자리표시자입니다. 승인 후 wrangler.toml 로 복사해 사용.
name = "gona-paradise-ranking"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "gona-paradise"
database_id = "<wrangler d1 create 가 발급하는 ID>"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://uipcjhj.github.io"
MIN_PARTICIPANTS = "20"
# TOKEN_PEPPER 는 vars 가 아니라 secret:  wrangler secret put TOKEN_PEPPER
